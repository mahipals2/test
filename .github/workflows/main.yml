name: Deployment Pipeline

on:
  push:
    branches:
      - main

jobs:

  dev:
    runs-on: ubuntu-latest

    steps:
      - name: Dev Stage
        run: echo "Deploying to DEV environment"

  pre-prod:
    runs-on: ubuntu-latest
    needs: dev

    steps:
      - name: Pre-Prod Stage
        run: echo "Deploying to PRE-PROD environment"

  production:
    runs-on: ubuntu-latest
    needs: pre-prod

    steps:
      - name: Production Stage
        run: echo "Deploying to PRODUCTION environment"
